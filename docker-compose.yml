services:
  db:
    image: postgres:16-alpine
    container_name: team-project-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: team_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_project"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
