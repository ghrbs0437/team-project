services:
  db:
    image: postgres:16-alpine
    container_name: soma17ai35-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soma17ai35
      POSTGRES_USER: soma
      POSTGRES_PASSWORD: soma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soma -d soma17ai35"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
